name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # تقدر تشغله يدوياً من صفحة Actions

jobs:
  build:
    name: Build with Nuitka (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Cache Nuitka's C compilation cache لتسريع الـ builds
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install nuitka
          pip install PySide6 openpyxl pandas numpy keyboard Pillow pyserial opencv-python pyzbar zxingcpp

      - name: Run build_exe.py
        working-directory: ${{ github.workspace }}
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestStationController-Windows
          path: dist\gui_app.dist\
          retention-days: 30
